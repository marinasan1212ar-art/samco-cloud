<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <title>Create Tax Invoice - SAMCO SAMCO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-6 antialiased font-sans">
    <div class="max-w-4xl mx-auto space-y-6">
        <div class="flex justify-between items-center">
            <a href="/invoices/" class="text-xs font-bold text-slate-600 hover:text-indigo-600 flex items-center gap-2"><!-- SAMCO LUXURY BRANDING LOGO -->
<div class="samco-brand-wrapper" style="display: flex; align-items: center; gap: 12px; padding: 6px 0;">
  <!-- Stylized S Icon Box -->
  <div style="width: 44px; height: 44px; min-width: 44px; border-radius: 12px; background: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #7928ca 100%); padding: 2px; box-shadow: 0 0 20px rgba(0, 242, 254, 0.4); display: flex; align-items: center; justify-content: center;">
    <div style="width: 100%; height: 100%; background: #070d19; border-radius: 10px; display: flex; align-items: center; justify-content: center;">
      <svg width="26" height="26" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Top S Curve (Cyan/Teal) -->
        <path d="M78 28C72 14 55 8 36 12C20 15 10 28 12 42C13 49 18 54 26 57L48 64C56 67 59 71 58 76C57 82 48 86 36 84C24 82 18 73 18 73L6 81C6 81 16 95 38 98C60 101 73 89 75 74C77 62 70 54 58 50L38 43C31 40 28 37 29 32C30 26 38 23 48 24C60 25 67 33 67 33L78 28Z" fill="url(#samco_s_grad)"/>
        <!-- Swoosh Accent -->
        <path d="M88 45C85 30 75 22 75 22L66 31C66 31 73 37 75 48C77 60 70 70 70 70L81 78C81 78 91 63 88 45Z" fill="url(#samco_accent_grad)"/>
        <defs>
          <linearGradient id="samco_s_grad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
            <stop stop-color="#00F2FE"/>
            <stop offset="0.5" stop-color="#38EF7D"/>
            <stop offset="1" stop-color="#4FACFE"/>
          </linearGradient>
          <linearGradient id="samco_accent_grad" x1="60" y1="20" x2="90" y2="80" gradientUnits="userSpaceOnUse">
            <stop stop-color="#00F2FE"/>
            <stop offset="1" stop-color="#7928CA"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
  </div>

  <!-- SAMCO Text Branding -->
  <div style="display: flex; flex-direction: column; justify-content: center;">
    <span style="font-size: 25px; font-weight: 900; letter-spacing: 2.5px; line-height: 1.05; text-transform: uppercase; background: linear-gradient(135deg, #00f2fe 0%, #38ef7d 45%, #4facfe 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 2px 10px rgba(0, 242, 254, 0.45)); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
      SAMCO
    </span>
    <span style="font-size: 8.5px; font-weight: 700; color: #64748b; letter-spacing: 2px; text-transform: uppercase; margin-top: 3px;">
      CLOUD ERP SYSTEM
    </span>
  </div>
</div></a>
            <span class="px-3 py-1 bg-indigo-50 text-indigo-700 font-bold text-xs rounded-full border border-indigo-200">
                Saudi ZATCA Phase 2 Compliant
            </span>
        </div>

        <form method="POST" class="bg-white border border-slate-200 rounded-2xl shadow-sm p-6 space-y-5">
            {% csrf_token %}
            <div class="border-b border-slate-100 pb-4">
                <h1 class="text-lg font-black text-slate-900">🧾 New Tax Invoice Form (إنشاء فاتورة ضريبية)</h1>
                <p class="text-xs text-slate-500">Enter customer and billing details to generate ZATCA verified invoice</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs font-semibold">
                <div>
                    <label class="block text-slate-600 mb-1">Invoice Number:</label>
                    <input type="text" name="invoice_number" required value="INV-{{ random_inv }}" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-mono">
                </div>
                <div>
                    <label class="block text-slate-600 mb-1">Issue Date:</label>
                    <input type="date" name="issue_date" required value="{% now 'Y-m-d' %}" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-mono">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs font-semibold">
                <div>
                    <label class="block text-slate-600 mb-1">Customer / Entity Name:</label>
                    <input type="text" name="customer_name" required placeholder="e.g. King Fahad Hospital" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl">
                </div>
                <div>
                    <label class="block text-slate-600 mb-1">Customer VAT ID (15-digits):</label>
                    <input type="text" name="customer_vat" placeholder="300000000000003" maxlength="15" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-mono">
                </div>
            </div>

            <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-3 text-xs">
                <div class="flex justify-between items-center">
                    <span class="font-bold text-slate-700">Subtotal Amount (Excl. VAT):</span>
                    <input type="number" step="0.01" id="subtotal" name="subtotal" required placeholder="0.00" oninput="calcVAT()" class="w-36 p-2 bg-white border border-slate-200 rounded-lg text-right font-mono font-bold">
                </div>
                <div class="flex justify-between items-center">
                    <span class="font-bold text-amber-600">ZATCA 15% VAT Amount:</span>
                    <input type="number" step="0.01" id="vat_amount" name="vat_amount" readonly placeholder="0.00" class="w-36 p-2 bg-slate-100 border border-slate-200 rounded-lg text-right font-mono font-bold text-amber-600">
                </div>
                <div class="border-t border-slate-200 pt-2 flex justify-between items-center text-sm font-black text-slate-900">
                    <span>Grand Total (Incl. VAT):</span>
                    <input type="number" step="0.01" id="grand_total" name="grand_total" readonly placeholder="0.00" class="w-40 p-2 bg-indigo-50 border border-indigo-200 rounded-lg text-right font-mono font-black text-indigo-700 text-base">
                </div>
            </div>

            <div class="pt-2 flex justify-end gap-3">
                <a href="/invoices/" class="px-5 py-2.5 rounded-xl border border-slate-200 text-xs font-bold text-slate-600 hover:bg-slate-50">Cancel</a>
                <button type="submit" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-xl shadow">
                    💾 Save & Issue Invoice
                </button>
            </div>
        </form>
    </div>

    <script>
    function calcVAT() {
        const sub = parseFloat(document.getElementById('subtotal').value) || 0;
        const vat = sub * 0.15;
        const total = sub + vat;
        document.getElementById('vat_amount').value = vat.toFixed(2);
        document.getElementById('grand_total').value = total.toFixed(2);
    }
    </script>
</body>
</html>
