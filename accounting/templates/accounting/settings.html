<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site administration | Django site admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; }
    </style>
</head>
<body class="bg-white text-slate-800 min-h-screen flex flex-col antialiased">

    <!-- DJANGO ADMIN HEADER (Exact Image 4 Style) -->
    <header class="bg-[#417690] text-white px-6 py-3 flex justify-between items-center shadow-xs">
        <div class="flex items-center gap-6">
            <a href="/admin/" class="text-xl font-medium tracking-wide text-[#ffc]">Django administration</a>
            <a href="/" class="text-xs bg-[#205067] hover:bg-[#1b4356] px-3 py-1.5 rounded text-white font-bold flex items-center gap-1.5 transition">
                <i class="fa-solid fa-house"></i> View Qoyod Site
            </a>
        </div>

        <!-- FACTORY DIVISION SHORTCUT ICONS IN HEADER -->
        <div class="flex items-center gap-2 bg-[#2d5f77] px-3 py-1 rounded-lg border border-[#4d86a2]">
            <span class="text-[10px] uppercase font-bold text-slate-200 mr-1">Divisions:</span>
            <a href="/division/warehouse/" title="Warehouse WMS" class="text-lg hover:scale-125 transition p-1">🏭</a>
            <a href="/division/media/" title="Media Division" class="text-lg hover:scale-125 transition p-1">📺</a>
            <a href="/division/plastic/" title="Plastic Division" class="text-lg hover:scale-125 transition p-1">♻️</a>
            <a href="/division/cosmetic/" title="Cosmetic Division" class="text-lg hover:scale-125 transition p-1">💄</a>
            <a href="/division/powder/" title="Powder Division" class="text-lg hover:scale-125 transition p-1">🧪</a>
            <span class="text-slate-400">|</span>
            <a href="/super-admin/" title="Super Admin Suite" class="text-lg hover:scale-125 transition p-1">👑</a>
        </div>

        <!-- User Controls -->
        <div class="text-xs flex items-center gap-2">
            <span>WELCOME, <strong class="uppercase">SHAMIM</strong>.</span>
            <a href="/" class="hover:underline text-slate-200">VIEW SITE</a> /
            <a href="/admin/password_change/" class="hover:underline text-slate-200">CHANGE PASSWORD</a> /
            <a href="/admin/logout/" class="hover:underline text-slate-200">LOG OUT</a>
        </div>
    </header>

    <!-- MAIN BODY CONTAINER (Exact Image 4 Layout) -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-6 space-y-6">
        
        <h2 class="text-xl font-normal text-slate-700">Site administration</h2>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            
            <!-- LEFT: ACCOUNTING MODELS TABLE (Exact Image 4) -->
            <div class="lg:col-span-8 border border-slate-200 rounded shadow-xs overflow-hidden">
                <div class="bg-[#417690] text-white px-4 py-2.5 font-bold text-xs uppercase tracking-wider">
                    ACCOUNTING
                </div>
                
                <table class="w-full text-left text-xs border-collapse">
                    <tbody class="divide-y divide-slate-100">
                        {% for item in model_list %}
                        <tr class="hover:bg-[#f9f9f9]">
                            <td class="p-3 font-semibold text-[#417690]">
                                <a href="{{ item.admin_url }}" class="hover:underline">{{ item.name }}</a>
                            </td>
                            <td class="p-3 text-right space-x-3 w-40">
                                <a href="{{ item.add_url }}" class="text-emerald-700 hover:underline font-medium">
                                    <strong class="text-emerald-600">+</strong> Add
                                </a>
                                <a href="{{ item.admin_url }}" class="text-amber-700 hover:underline font-medium">
                                    ✎ Change
                                </a>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>

            <!-- RIGHT: RECENT ACTIONS PANEL (Exact Image 4) -->
            <div class="lg:col-span-4 bg-[#f8f8f8] border border-slate-200 rounded p-4 shadow-xs space-y-3">
                <h3 class="font-bold text-slate-700 text-sm pb-2 border-b border-slate-200">Recent actions</h3>
                <div class="text-xs text-slate-500">
                    <span class="font-bold text-slate-700 block mb-1">My actions</span>
                    <p class="italic text-slate-400">None available</p>
                </div>
            </div>

        </div>

    </main>

</body>
</html>
