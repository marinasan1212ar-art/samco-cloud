<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Credit Note for Invoice #{{ invoice.invoice_no }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8 flex justify-center items-center">

    <div class="w-full max-w-2xl bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6">
        <div class="flex justify-between items-center border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-lg font-black text-white">🔄 Create Sales Return (إشعار دائن / مرتجع مبيعات)</h1>
                <p class="text-xs text-slate-400 mt-0.5">Original Invoice: <span class="font-bold text-cyan-400">#{{ invoice.invoice_no }}</span> ({{ invoice.customer.name }})</p>
            </div>
            <a href="/invoice/{{ invoice.id }}/" class="text-xs text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></a>
        </div>

        <form method="POST" class="space-y-5 text-xs">
            {% csrf_token %}
            <div>
                <label class="block font-bold text-slate-300 mb-1">Reason for Return / سبب الإرجاع *</label>
                <input type="text" name="reason" value="Customer Return (مرتجع بضاعة من العميل)" required class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white font-bold">
            </div>

            <div>
                <label class="block font-bold text-slate-300 mb-2">Select Items & Quantities to Return:</label>
                <div class="space-y-2">
                    {% for item in invoice.items.all %}
                    <div class="flex justify-between items-center bg-slate-800/60 p-3 rounded-xl border border-slate-700">
                        <div class="flex-1">
                            <p class="font-bold text-white">{{ item.product.name }}</p>
                            <p class="text-[10px] text-slate-400">Purchased Qty: {{ item.qty }} | Price: {{ item.unit_price }} SAR</p>
                        </div>
                        <div class="w-32 flex items-center gap-2">
                            <label class="text-[10px] text-slate-400">Return:</label>
                            <input type="number" min="0" max="{{ item.qty }}" name="return_qty_{{ item.id }}" value="1" class="w-full bg-slate-900 border border-cyan-500/40 rounded-lg p-2 text-center text-white font-bold">
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>

            <button type="submit" class="w-full bg-rose-500 hover:bg-rose-400 text-slate-950 font-black py-3.5 rounded-xl text-sm shadow-xl transition">
                ✓ Confirm & Issue Official ZATCA Credit Note
            </button>
        </form>
    </div>

</body>
</html>
