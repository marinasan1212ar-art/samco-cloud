    function applyLanguage(lang) {
        const root = document.getElementById('htmlRoot');
        const langBtnText = document.getElementById('langBtnText');
        const searchInput = document.getElementById('globalSearch');
        
        root.setAttribute('lang', lang);
        root.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
        
        if (langBtnText) langBtnText.innerText = i18nData[lang].lang_btn;
        if (searchInput) searchInput.setAttribute('placeholder', i18nData[lang].search_ph);

        document.querySelectorAll('[data-i18n]').forEach(elem => {
            const key = elem.getAttribute('data-i18n');
            if (i18nData[lang][key]) elem.innerText = i18nData[lang][key];
        });

        const hour = new Date().getHours();
        const elem = document.getElementById('dynamic-greeting');
        if (elem) {
            let greeting = 'Good Afternoon';
            if (hour >= 5 && hour < 12) greeting = (lang === 'ar') ? 'صباح الخير' : 'Good Morning';
            else if (hour >= 12 && hour < 17) greeting = (lang === 'ar') ? 'مساء الخير' : 'Good Afternoon';
            else greeting = (lang === 'ar') ? 'مساء الخير' : 'Good Evening';
            elem.innerText = greeting;
        }

        localStorage.setItem('qoyod_lang', lang);
    }

    document.addEventListener('DOMContentLoaded', function() {
        const savedLang = localStorage.getItem('qoyod_lang') || 'en';
        applyLanguage(savedLang);

        const langToggleBtn = document.getElementById('langToggleBtn');
        if (langToggleBtn) {
            langToggleBtn.addEventListener('click', function() {
                const currentLang = localStorage.getItem('qoyod_lang') || 'en';
                applyLanguage(currentLang === 'en' ? 'ar' : 'en');
            });
        }

        // Accordion Dropdowns
        document.querySelectorAll('.sidebar-dropdown-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                const targetId = this.getAttribute('data-target');
                const targetSubmenu = document.getElementById(targetId);
                const chevron = this.querySelector('.fa-chevron-down');
                
                if (targetSubmenu) {
                    const isHidden = targetSubmenu.classList.contains('hidden');
                    document.querySelectorAll('[id$="-submenu"]').forEach(sm => {
                        if (sm.id !== targetId) sm.classList.add('hidden');
                    });
                    document.querySelectorAll('.sidebar-dropdown-btn .fa-chevron-down').forEach(ch => {
                        if (ch !== chevron) ch.classList.remove('rotate-180');
                    });

                    targetSubmenu.classList.toggle('hidden');
                    if (chevron) chevron.classList.toggle('rotate-180', isHidden);
                }
            });
        });

        // 3-Dot Toggle
        const sidebar = document.getElementById('sidebar');
        const sidebarToggle = document.getElementById('sidebarToggle');
        const navLabels = document.querySelectorAll('.nav-label');
        const logoSubtitles = document.getElementById('logo-subtitles');
        const planBadge = document.getElementById('plan-badge');

        if (sidebarToggle && sidebar) {
            sidebarToggle.addEventListener('click', function(e) {
                e.stopPropagation();
                if (sidebar.classList.contains('w-64')) {
                    sidebar.classList.remove('w-64');
                    sidebar.classList.add('w-20');
                    navLabels.forEach(lbl => lbl.classList.add('hidden'));
                    document.querySelectorAll('[id$="-submenu"]').forEach(sm => sm.classList.add('hidden'));
                    if (logoSubtitles) logoSubtitles.classList.add('hidden');
                    if (planBadge) planBadge.classList.add('hidden');
                } else {
                    sidebar.classList.remove('w-20');
                    sidebar.classList.add('w-64');
                    navLabels.forEach(lbl => lbl.classList.remove('hidden'));
                    if (logoSubtitles) logoSubtitles.classList.remove('hidden');
                    if (planBadge) planBadge.classList.remove('hidden');
                }
            });
        }

        // Quick Plus
        const quickPlusBtn = document.getElementById('quickPlusBtn');
        const quickPlusMenu = document.getElementById('quickPlusMenu');
        if (quickPlusBtn && quickPlusMenu) {
            quickPlusBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                quickPlusMenu.classList.toggle('hidden');
                if (notifMenu) notifMenu.classList.add('hidden');
            });
        }

        // Notification
        const notifBtn = document.getElementById('notifBtn');
        const notifMenu = document.getElementById('notifMenu');
        if (notifBtn && notifMenu) {
            notifBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                notifMenu.classList.toggle('hidden');
                if (quickPlusMenu) quickPlusMenu.classList.add('hidden');
            });
        }

        document.addEventListener('click', function() {
            if (quickPlusMenu) quickPlusMenu.classList.add('hidden');
            if (notifMenu) notifMenu.classList.add('hidden');
        });

        window.addEventListener('keydown', function(e) {
            if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
                e.preventDefault();
                const searchInput = document.getElementById('globalSearch');
                if (searchInput) searchInput.focus();
            }
        });
    });
