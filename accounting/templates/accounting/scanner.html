<!DOCTYPE html>
<html lang="{% if is_ar %}ar{% else %}en{% endif %}" dir="{{ lang_dir }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Camera Barcode Scanner - SAMCO ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- HTML5 QR / Barcode Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode"></script>

<style>
  aside {
    background: linear-gradient(180deg, #070c18 0%, #0d1527 50%, #040711 100%) !important;
    border-right: 1px solid rgba(255, 255, 255, 0.08) !important;
  }
</style>


<style>
  aside {
    background: linear-gradient(180deg, #070c18 0%, #0d1527 50%, #040711 100%) !important;
    border-right: 1px solid rgba(255, 255, 255, 0.08) !important;
  }
</style>

</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased p-4 md:p-8 flex flex-col items-center">

    <div class="w-full max-w-md mb-4 flex justify-between items-center">
        <a href="/" class="text-xs font-semibold text-slate-400 hover:text-white flex items-center gap-2"><div style="display:inline-flex; align-items:center; gap:10px;">
        <svg width="44" height="34" viewBox="0 0 100 80" fill="none" xmlns="http://www.w3.org/2000/svg" style="transform: skewX(-14deg); filter: drop-shadow(0 0 8px rgba(0, 242, 254, 0.6));">
          <path d="M78 10C58 4 32 8 18 22C8 32 6 42 10 50C13 41 20 33 32 26C46 19 68 18 84 22L78 10Z" fill="url(#s_cyan_final)"/>
          <path d="M32 24C22 30 16 38 14 45C17 39 24 33 34 29C48 23 66 22 78 25L76 21C64 18 46 20 32 24Z" fill="#ffffff" opacity="0.9"/>
          <path d="M22 70C42 76 68 72 82 58C92 48 94 38 90 30C87 39 80 47 68 54C54 61 32 62 16 58L22 70Z" fill="url(#s_cyan_final)"/>
          <path d="M68 56C78 50 84 42 86 35C83 41 76 47 66 51C52 57 34 58 22 55L24 59C36 62 54 60 68 56Z" fill="#ffffff" opacity="0.9"/>
          <defs>
            <linearGradient id="s_cyan_final" x1="0" y1="0" x2="100" y2="80" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#00f2fe"/>
              <stop offset="50%" stop-color="#38ef7d"/>
              <stop offset="100%" stop-color="#4facfe"/>
            </linearGradient>
          </defs>
        </svg>
        <div style="display:flex; flex-direction:column; justify-content:center;">
          <span style="font-size:24px; font-weight:900; letter-spacing:2px; line-height:1; text-transform:uppercase; background:linear-gradient(135deg, #00f2fe 0%, #38ef7d 45%, #4facfe 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; filter:drop-shadow(0 2px 10px rgba(0, 242, 254, 0.45)); font-family:system-ui, sans-serif;">
            SAMCO
          </span>
          <span style="font-size:8px; font-weight:700; color:#94a3b8; letter-spacing:1.5px; text-transform:uppercase; margin-top:2px;">
            CLOUD ERP SYSTEM
          </span>
        </div>
      </div></a>
        <span class="text-xs bg-emerald-500/10 text-emerald-400 px-3 py-1 rounded-full border border-emerald-500/20 font-bold">
            📷 Live Phone Camera
        </span>
    </div>

    <!-- Scanner Box -->
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl text-center space-y-4">
        <h1 class="text-lg font-black text-white">📱 {% if is_ar %}ماسح الباركود بالكاميرا{% else %}In-Browser Barcode & QR Scanner{% endif %}</h1>
        <p class="text-xs text-slate-400">Point mobile camera directly at any product barcode or ZATCA QR code.</p>

        <!-- Camera Viewport -->
        <div id="reader" class="rounded-2xl overflow-hidden border-2 border-cyan-500/40 bg-black min-h-[260px]"></div>

        <!-- Result Box -->
        <div class="p-4 bg-slate-800/60 rounded-2xl border border-slate-700 text-left space-y-2">
            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Scanned Decoded Payload:</span>
            <p id="scan-result" class="text-sm font-black text-emerald-400 font-mono break-all">Awaiting camera scan...</p>
        </div>
    </div>

    <script>
        function onScanSuccess(decodedText, decodedResult) {
            document.getElementById('scan-result').innerText = decodedText;
            if (navigator.vibrate) navigator.vibrate(100); // Haptic feedback on phone
        }

        const html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", { fps: 15, qrbox: { width: 250, height: 250 } }, false
        );
        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>
