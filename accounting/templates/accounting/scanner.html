<!DOCTYPE html>
<html lang="{% if is_ar %}ar{% else %}en{% endif %}" dir="{{ lang_dir }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Camera Barcode Scanner - SAMCO ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- HTML5 QR / Barcode Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode"></script>

<style>
  /* GORGEOUS SIDEBAR NAVIGATION PANEL */
  aside, .sidebar-container, nav[class*="bg-"] {
    background: linear-gradient(180deg, #070d19 0%, #0d1527 50%, #040711 100%) !important;
    border-right: 1px solid rgba(255, 255, 255, 0.08) !important;
  }
</style>

</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased p-4 md:p-8 flex flex-col items-center">

    <div class="w-full max-w-md mb-4 flex justify-between items-center">
        <a href="/" class="text-xs font-semibold text-slate-400 hover:text-white flex items-center gap-2"><!-- EXACT SAMCO EMBLEM BRANDING -->
<div style="display: flex; align-items: center; gap: 10px; padding: 6px 0;">
  <!-- Real SAMCO Double Swoosh S Logo (No Box, Exactly like Image 2) -->
  <svg width="42" height="34" viewBox="0 0 120 90" fill="none" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(0 2px 8px rgba(0, 242, 254, 0.5));">
    <!-- Top Left Main Swoosh -->
    <path d="M15 42C12 28 22 12 45 6C70 -1 92 6 98 16C82 12 60 14 42 24C28 32 22 42 20 48L15 42Z" fill="url(#s_grad1)"/>
    <!-- Top Inner Swoosh Wing -->
    <path d="M32 38C26 28 36 18 52 14C68 10 82 14 88 20C74 18 56 22 44 30C36 35 33 40 32 38Z" fill="url(#s_grad2)" opacity="0.85"/>
    
    <!-- Bottom Right Main Swoosh -->
    <path d="M105 48C108 62 98 78 75 84C50 91 28 84 22 74C38 78 60 76 78 66C92 58 98 48 100 42L105 48Z" fill="url(#s_grad1)"/>
    <!-- Bottom Inner Swoosh Wing -->
    <path d="M88 52C94 62 84 72 68 76C52 80 38 76 32 70C46 72 64 68 76 60C84 55 87 50 88 52Z" fill="url(#s_grad2)" opacity="0.85"/>

    <defs>
      <linearGradient id="s_grad1" x1="0" y1="0" x2="120" y2="90" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#00f2fe"/>
        <stop offset="50%" stop-color="#38ef7d"/>
        <stop offset="100%" stop-color="#4facfe"/>
      </linearGradient>
      <linearGradient id="s_grad2" x1="0" y1="0" x2="120" y2="90" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="60%" stop-color="#00f2fe"/>
        <stop offset="100%" stop-color="#7928ca"/>
      </linearGradient>
    </defs>
  </svg>

  <!-- Gorgeous SAMCO Typography -->
  <div style="display: flex; flex-direction: column; justify-content: center;">
    <span style="font-size: 26px; font-weight: 900; letter-spacing: 3px; line-height: 1; text-transform: uppercase; background: linear-gradient(135deg, #00f2fe 0%, #38ef7d 40%, #4facfe 80%, #a855f7 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 2px 10px rgba(0, 242, 254, 0.45)); font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
      SAMCO
    </span>
    <span style="font-size: 8px; font-weight: 700; color: #94a3b8; letter-spacing: 2px; text-transform: uppercase; margin-top: 2px;">
      CLOUD ERP SYSTEM
    </span>
  </div>
</div></a>
        <span class="text-xs bg-emerald-500/10 text-emerald-400 px-3 py-1 rounded-full border border-emerald-500/20 font-bold">
            📷 Live Phone Camera
        </span>
    </div>

    <!-- Scanner Box -->
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl text-center space-y-4">
        <h1 class="text-lg font-black text-white">📱 {% if is_ar %}ماسح الباركود بالكاميرا{% else %}In-Browser Barcode & QR Scanner{% endif %}</h1>
        <p class="text-xs text-slate-400">Point mobile camera directly at any product barcode or ZATCA QR code.</p>

        <!-- Camera Viewport -->
        <div id="reader" class="rounded-2xl overflow-hidden border-2 border-cyan-500/40 bg-black min-h-[260px]"></div>

        <!-- Result Box -->
        <div class="p-4 bg-slate-800/60 rounded-2xl border border-slate-700 text-left space-y-2">
            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Scanned Decoded Payload:</span>
            <p id="scan-result" class="text-sm font-black text-emerald-400 font-mono break-all">Awaiting camera scan...</p>
        </div>
    </div>

    <script>
        function onScanSuccess(decodedText, decodedResult) {
            document.getElementById('scan-result').innerText = decodedText;
            if (navigator.vibrate) navigator.vibrate(100); // Haptic feedback on phone
        }

        const html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", { fps: 15, qrbox: { width: 250, height: 250 } }, false
        );
        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>
