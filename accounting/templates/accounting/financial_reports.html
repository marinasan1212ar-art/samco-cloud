<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <title>Financial Reports - QOYOD SAMCO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  aside {
    background: linear-gradient(180deg, #070c18 0%, #0d1527 50%, #040711 100%) !important;
    border-right: 1px solid rgba(255, 255, 255, 0.08) !important;
  }
</style>

</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-6 antialiased font-sans">
    <div class="max-w-6xl mx-auto space-y-6">
        <div class="flex justify-between items-center">
            <!-- SAMCO FINAL CLEAN BRANDING -->
        <a href="/" style="display: inline-flex; align-items: center; gap: 10px; text-decoration: none; padding: 4px 0;">
          <!-- Exact Image 2 Slanted S-Swoosh -->
          <svg width="44" height="34" viewBox="0 0 100 80" fill="none" xmlns="http://www.w3.org/2000/svg" style="min-width: 44px; transform: skewX(-14deg); filter: drop-shadow(0 0 10px rgba(0, 242, 254, 0.65));">
            <!-- Top S Blade -->
            <path d="M78 10C58 4 32 8 18 22C8 32 6 42 10 50C13 41 20 33 32 26C46 19 68 18 84 22L78 10Z" fill="url(#scyan_final)"/>
            <!-- Top S Inner Silver/Cyan Line -->
            <path d="M32 24C22 30 16 38 14 45C17 39 24 33 34 29C48 23 66 22 78 25L76 21C64 18 46 20 32 24Z" fill="#ffffff" opacity="0.9"/>
            
            <!-- Bottom S Blade -->
            <path d="M22 70C42 76 68 72 82 58C92 48 94 38 90 30C87 39 80 47 68 54C54 61 32 62 16 58L22 70Z" fill="url(#scyan_final)"/>
            <!-- Bottom S Inner Silver/Cyan Line -->
            <path d="M68 56C78 50 84 42 86 35C83 41 76 47 66 51C52 57 34 58 22 55L24 59C36 62 54 60 68 56Z" fill="#ffffff" opacity="0.9"/>
            <defs>
              <linearGradient id="scyan_final" x1="0" y1="0" x2="100" y2="80" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#00f2fe"/>
                <stop offset="50%" stop-color="#38ef7d"/>
                <stop offset="100%" stop-color="#4facfe"/>
              </linearGradient>
            </defs>
          </svg>

          <!-- SAMCO Gorgeous Text -->
          <div style="display: flex; flex-direction: column; justify-content: center;">
            <span style="font-size: 25px; font-weight: 900; letter-spacing: 2px; line-height: 1; text-transform: uppercase; background: linear-gradient(135deg, #00f2fe 0%, #38ef7d 45%, #4facfe 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 2px 10px rgba(0, 242, 254, 0.45)); font-family: system-ui, sans-serif;">
              SAMCO
            </span>
            <span style="font-size: 8px; font-weight: 700; color: #94a3b8; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 3px;">
              CLOUD ERP SYSTEM
            </span>
          </div>
        </a>
            <h1 class="text-xl font-black text-slate-900">📊 Financial Reports & Balance Sheets</h1>
            <span></span>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-5 text-xs">
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-2">
                <span class="text-slate-400 font-bold uppercase">Income & Revenue</span>
                <p class="text-2xl font-black text-slate-900 font-mono">SAR {{ total_sales|floatformat:2 }}</p>
                <p class="text-emerald-600 font-bold">Total Invoiced Sales</p>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-2">
                <span class="text-slate-400 font-bold uppercase">Expenses & Costs</span>
                <p class="text-2xl font-black text-slate-900 font-mono">SAR {{ total_expenses|floatformat:2 }}</p>
                <p class="text-rose-500 font-bold">Direct Operating Expenses</p>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-2">
                <span class="text-slate-400 font-bold uppercase">Net Profit Yield</span>
                <p class="text-2xl font-black text-indigo-600 font-mono">SAR {{ net_profit|floatformat:2 }}</p>
                <p class="text-indigo-600 font-bold">Trading Surplus</p>
            </div>
        </div>
    </div>
</body>
</html>
