<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Issue Delivery Note for Invoice #{{ invoice.invoice_no }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8 flex justify-center items-center">

    <div class="w-full max-w-2xl bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6">
        <div class="flex justify-between items-center border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-lg font-black text-white">🚚 Issue Delivery Note (سند تسليم بضاعة)</h1>
                <p class="text-xs text-slate-400 mt-0.5">Invoice Ref: <span class="font-bold text-cyan-400">#{{ invoice.invoice_no }}</span> ({{ invoice.customer.name }})</p>
            </div>
            <a href="/invoice/{{ invoice.id }}/" class="text-xs text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></a>
        </div>

        <form method="POST" class="space-y-4 text-xs">
            {% csrf_token %}
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block font-bold text-slate-300 mb-1">Driver Name / اسم السائق</label>
                    <input type="text" name="driver_name" placeholder="Driver Name" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white font-bold">
                </div>
                <div>
                    <label class="block font-bold text-slate-300 mb-1">Vehicle Plate / رقم اللوحة</label>
                    <input type="text" name="vehicle_no" placeholder="e.g. ABC-1234" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white font-bold">
                </div>
            </div>

            <div>
                <label class="block font-bold text-slate-300 mb-1">Dispatching Warehouse</label>
                <select name="warehouse_id" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white font-bold">
                    {% for wh in warehouses %}
                    <option value="{{ wh.id }}">{{ wh.name_en }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block font-bold text-slate-300 mb-2">Item Delivery & SFDA Batch Details:</label>
                <div class="space-y-2">
                    {% for item in invoice.items.all %}
                    <div class="grid grid-cols-3 gap-2 bg-slate-800/60 p-3 rounded-xl border border-slate-700 items-center">
                        <div>
                            <p class="font-bold text-white">{{ item.product.name }}</p>
                            <p class="text-[10px] text-slate-400">Order Qty: {{ item.qty }}</p>
                        </div>
                        <div>
                            <input type="text" name="batch_{{ item.id }}" value="{{ item.batch_no|default:'BATCH-01' }}" placeholder="Batch No" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-center text-white">
                        </div>
                        <div>
                            <input type="number" name="qty_{{ item.id }}" value="{{ item.qty }}" class="w-full bg-slate-900 border border-emerald-500/40 rounded-lg p-2 text-center text-white font-bold">
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>

            <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-3.5 rounded-xl text-sm shadow-xl transition">
                ✓ Confirm Dispatch & Generate Delivery Slip
            </button>
        </form>
    </div>

</body>
</html>
